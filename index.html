<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Produk Toko</title>
</head>
<body>

    <h1>Manajemen Produk Toko</h1>

    <div id="hasil"></div>

    <script>
        // Array produk toko
        let produkToko = [
            { id: 1, nama: "Laptop", harga: 7000000, stok: 5 },
            { id: 2, nama: "Mouse", harga: 200000, stok: 10 },
            { id: 3, nama: "Keyboard", harga: 350000, stok: 7 }
        ];

        // Fungsi untuk menambahkan produk
        function tambahProduk(nama, harga, stok) {
            let idBaru = produkToko.length + 1;

            produkToko.push({
                id: idBaru,
                nama: nama,
                harga: harga,
                stok: stok
            });
        }

        // Fungsi untuk menghapus produk berdasarkan ID
        function hapusProduk(id) {
            produkToko = produkToko.filter(function(produk) {
                return produk.id !== id;
            });
        }

        // Fungsi untuk menampilkan daftar produk
        function tampilkanProduk() {
            let hasil = "<h2>Daftar Produk</h2>";

            hasil += "<table border='1' cellpadding='10'>";
            hasil += "<tr>";
            hasil += "<th>ID</th>";
            hasil += "<th>Nama</th>";
            hasil += "<th>Harga</th>";
            hasil += "<th>Stok</th>";
            hasil += "</tr>";

            produkToko.forEach(function(produk) {
                hasil += `
                    <tr>
                        <td>${produk.id}</td>
                        <td>${produk.nama}</td>
                        <td>Rp ${produk.harga.toLocaleString("id-ID")}</td>
                        <td>${produk.stok}</td>
                    </tr>
                `;
            });

            hasil += "</table>";

            document.getElementById("hasil").innerHTML = hasil;
        }

        // Menambahkan produk baru
tambahProduk("Headset", 500000, 8);
tambahProduk("Monitor", 1500000, 6);
tambahProduk("Flashdisk", 100000, 15);

// Menampilkan daftar produk
tampilkanProduk();
// Menghapus produk ID 2
hapusProduk(2);

// Menampilkan daftar setelah dihapus
tampilkanProduk();


        
    </script>

</body>
</html>
